name: release
# Al publicar un tag v*: compila TODO desde un runner Linux (npm run release) y adjunta dist-release/<versión> a la release. La versión es el tag tal cual (vX.Y.Z): así coincide con la carpeta de descarga que usa el instalador.
# Secreto necesario: RELEASE_TOKEN (token de la cuenta con permiso de escritura en el repo).
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-go@v5
        with: { go-version-file: installer/go.mod }
      - run: npm ci
      - name: Compilar (servidor SEA + instalador, 5 plataformas)
        run: npm run release -- "${GITHUB_REF_NAME}"
      - name: Publicar
        env:
          FORGE: forgejo
          FORGE_URL: ${{ github.server_url }}
          FORGE_REPO: ${{ github.repository }}
          FORGE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGE_TAG: ${{ github.ref_name }}
        run: node tools/release/publish.mjs "${GITHUB_REF_NAME}"
