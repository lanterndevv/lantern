name: release
# Al publicar un tag v*: construye lantern-server (Node SEA) e instalador (Go) para 5 plataformas y los sube a la release con SHA256SUMS.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: lantern-server-linux-x64 }
          - { os: ubuntu-24.04-arm, name: lantern-server-linux-arm64 }
          - { os: macos-15-intel, name: lantern-server-macos-x64 }
          - { os: macos-latest, name: lantern-server-macos-arm64 }
          - { os: windows-latest, name: lantern-server-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run sea
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: 'dist-bin/${{ matrix.name }}' }

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: installer/go.mod }
      - name: Compilar para las 5 plataformas
        working-directory: installer
        env: { CGO_ENABLED: '0' }
        run: |
          mkdir -p ../out
          for t in linux/amd64/linux-x64 linux/arm64/linux-arm64 darwin/amd64/macos-x64 darwin/arm64/macos-arm64 windows/amd64/windows-x64.exe; do
            IFS=/ read -r os arch name <<<"$t"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "../out/lantern-installer-$name" .
          done
      - uses: actions/upload-artifact@v4
        with: { name: lantern-installer, path: out/* }

  release:
    needs: [server, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: SHA256SUMS
        working-directory: files
        run: sha256sum lantern-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: files/* }
